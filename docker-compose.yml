# MongoDB transactions need a replica set. A plain standalone mongod does NOT
# support them, and the ledger relies on them to keep the balance and the
# ledger entries in step. So even for local development, run a one-node
# replica set rather than a standalone.
#
#   docker compose up -d
#   docker compose exec mongo mongosh --eval 'rs.initiate()'   # once, first time
#
# MONGODB_URI=mongodb://localhost:27017/venue-access?replicaSet=rs0
#
# Atlas (including the free M0 tier) is already a replica set — nothing to do there.
services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodata:
